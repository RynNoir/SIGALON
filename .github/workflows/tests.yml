name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # CI tidak punya server MariaDB: migrasi di langkah setup memakai file SQLite.
    # Variabel di sini menimpa nilai DB_* dari .env.example. Tes sendiri memakai SQLite in-memory (phpunit.xml).
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/database/database.sqlite

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          # Samakan dengan PHP pengembang; composer.lock memuat Symfony 8.1 yang butuh PHP >= 8.4.1.
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Prepare SQLite database
        run: touch database/database.sqlite

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
